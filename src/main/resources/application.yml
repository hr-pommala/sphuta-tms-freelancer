server:
  port: 8080

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO

# ===============================
# 📘 Swagger / OpenAPI config
# ===============================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# ===============================
# 🧠 AUTH DB (In-memory H2 for auth module)
# ===============================
auth:
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# ===============================
# 🔐 JWT Config
# ===============================
jwt:
  secret: verysecret_jwt_key_for_dev_change_me
  expirationMs: 3600000
